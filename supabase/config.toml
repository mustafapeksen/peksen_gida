# Supabase CLI 2.119.0. Disposable local project only; never linked to production.
project_id = "peksen_gida_phase3_local"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/business_foundation.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
# Signup creates an active customer; email ownership is verified before login.
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Pekşen Gıda kayıt kodunuz"
content_path = "./supabase/templates/code.html"
[auth.email.template.invite]
subject = "Pekşen Gıda davet kodunuz"
content_path = "./supabase/templates/code.html"
[auth.email.template.recovery]
subject = "Pekşen Gıda parola yenileme kodunuz"
content_path = "./supabase/templates/code.html"

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = true

[functions.invite-account]
verify_jwt = false
